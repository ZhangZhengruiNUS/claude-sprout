[package]
name = "claude-sprout"
version = "0.1.0"
description = "Windows-first desktop companion for Claude Code CLI sessions"
authors = ["Claude Sprout contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "claude_sprout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
